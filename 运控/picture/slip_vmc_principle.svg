<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .head{font:700 22px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:400 16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}
      .force{stroke:#16a34a;stroke-width:5;fill:none;marker-end:url(#g)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">SLIP 提供弹簧腿直觉，VMC 把虚拟力转换成关节命令</text>

  <rect x="45" y="90" width="470" height="440" rx="18" class="panel"/>
  <text x="280" y="130" text-anchor="middle" class="head">SLIP：支撑腿压缩并回弹</text>
  <line x1="95" y1="430" x2="465" y2="430" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <path d="M270 430l-17-20 34-20-34-20 34-20-34-20 34-20-17-20" stroke="#2563eb" stroke-width="7" fill="none"/>
  <circle cx="270" cy="270" r="28" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <path d="M335 275C390 315 390 385 335 420" class="arrow"/>
  <text x="350" y="340" class="body">压缩 → 储能</text>
  <text x="350" y="372" class="body">回弹 → 释放</text>
  <text x="280" y="470" text-anchor="middle" class="small">保留质心、腿长、刚度、阻尼和接触相位</text>
  <text x="280" y="500" text-anchor="middle" class="small">不显式描述每个真实关节</text>

  <path d="M515 310H595" class="arrow"/>
  <rect x="600" y="90" width="555" height="440" rx="18" class="panel"/>
  <text x="877" y="130" text-anchor="middle" class="head">VMC：在软件中构造虚拟弹簧阻尼</text>
  <rect x="655" y="175" width="205" height="90" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="757" y="210" text-anchor="middle" class="body">状态估计 + 参考</text>
  <text x="757" y="240" text-anchor="middle" class="small">腿长、速度、姿态</text>
  <rect x="925" y="175" width="180" height="90" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="1015" y="210" text-anchor="middle" class="body">期望足端力 f_des</text>
  <text x="1015" y="240" text-anchor="middle" class="small">弹簧 + 阻尼</text>
  <path d="M860 220H920" class="arrow"/>
  <rect x="790" y="330" width="190" height="90" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/>
  <text x="885" y="365" text-anchor="middle" class="body">τ ≈ Jᵀ f_des</text>
  <text x="885" y="395" text-anchor="middle" class="small">映射成关节力矩</text>
  <path d="M1015 270C1015 315 950 315 950 325" class="force"/>
  <text x="877" y="470" text-anchor="middle" class="small">真实接触力仍受摩擦、全身耦合和电机极限约束</text>
  <text x="877" y="500" text-anchor="middle" class="small">接触相位判断错，会使用错误的控制模式</text>

  <rect x="175" y="555" width="850" height="44" rx="13" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="600" y="584" text-anchor="middle" class="body">“虚拟”指软件制造期望力学行为，不要求机器人真的安装同样的机械弹簧</text>
</svg>
