    <rect x="1015" y="385" width="190" height="76" rx="14" class="learn"/>
    <rect x="1230" y="385" width="190" height="76" rx="14" class="learn"/>
    <rect x="800" y="495" width="190" height="76" rx="14" class="learn"/>
    <rect x="1015" y="495" width="190" height="76" rx="14" class="learn"/>
    <rect x="1230" y="495" width="190" height="76" rx="14" class="learn"/>
    <text x="895" y="417" text-anchor="middle" class="nodeTitle">13 强化学习</text><text x="895" y="442" text-anchor="middle" class="nodeBody">策略怎样学出来</text>
    <text x="1110" y="417" text-anchor="middle" class="nodeTitle">14 腿足 RL 工程</text><text x="1110" y="442" text-anchor="middle" class="nodeBody">观测、动作、奖励</text>
    <text x="1325" y="417" text-anchor="middle" class="nodeTitle">15 特权学习</text><text x="1325" y="442" text-anchor="middle" class="nodeBody">训练多看、部署少看</text>
    <text x="895" y="527" text-anchor="middle" class="nodeTitle">16 感知行走</text><text x="895" y="552" text-anchor="middle" class="nodeBody">地形证据进入策略</text>
    <text x="1110" y="527" text-anchor="middle" class="nodeTitle">17 模仿学习</text><text x="1110" y="552" text-anchor="middle" class="nodeBody">人体动作 → 机器人</text>
    <text x="1325" y="527" text-anchor="middle" class="nodeTitle">18 多动作策略</text><text x="1325" y="552" text-anchor="middle" class="nodeBody">单技能 → 行为模型</text>
    <path d="M990 423H1010M1205 423H1225" class="branch"/>
    <path d="M1325 461V480H895V490M1110 461V490M1205 533H1225" class="branch"/>
  </g>
  <path d="M1345 286V320H365V380M1345 320H1110V380" class="branch"/>

  <text x="750" y="640" text-anchor="middle" class="part">第四部分 · 两条路线汇合、落地与实践</text>
  <rect x="350" y="675" width="250" height="76" rx="16" class="integrate"/>
  <rect x="625" y="675" width="250" height="76" rx="16" class="integrate"/>
  <rect x="900" y="675" width="250" height="76" rx="16" class="integrate"/>
  <text x="475" y="706" text-anchor="middle" class="nodeTitle">19 Sim2Real</text><text x="475" y="731" text-anchor="middle" class="nodeBody">接口、时延、模型与现实</text>
  <text x="750" y="706" text-anchor="middle" class="nodeTitle">20 传统与学习如何选</text><text x="750" y="731" text-anchor="middle" class="nodeBody">按问题、约束与风险组合</text>
  <text x="1025" y="706" text-anchor="middle" class="nodeTitle">21 项目路线</text><text x="1025" y="731" text-anchor="middle" class="nodeBody">实现、验收、日志、安全部署</text>
  <path d="M365 571V610H475V670M1110 571V610H475" class="branch"/>
  <path d="M600 713H620M875 713H895" class="branch"/>

  <rect x="390" y="835" width="320" height="112" rx="16" class="appendix"/>
  <rect x="790" y="835" width="320" height="112" rx="16" class="appendix"/>
  <text x="550" y="870" text-anchor="middle" class="nodeTitle">附录 A · 数学急救包</text>
  <text x="550" y="898" text-anchor="middle" class="nodeBody">遇到向量、导数、概率、秩或优化障碍时按需查阅</text>
  <text x="950" y="870" text-anchor="middle" class="nodeTitle">附录 B · 缩写和符号</text>
  <text x="950" y="898" text-anchor="middle" class="nodeBody">遇到陌生缩写、符号复用和单位问题时查阅</text>
  <path d="M550 835V795H145V290" class="lookup"/>
  <path d="M950 835V790H1345V290" class="lookup"/>
  <text x="750" y="1002" text-anchor="middle" class="note">实线：主要学习依赖　　虚线：按需查阅；08/09 与 16/17 是可并行理解的专题，不是严格升级链</text>
