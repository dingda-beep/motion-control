    <rect x="255" y="210" width="180" height="76" rx="14" class="base"/>
    <rect x="455" y="210" width="180" height="76" rx="14" class="base"/>
    <rect x="655" y="210" width="180" height="76" rx="14" class="base"/>
    <rect x="855" y="210" width="180" height="76" rx="14" class="base"/>
    <rect x="1055" y="210" width="180" height="76" rx="14" class="base"/>
    <rect x="1255" y="210" width="180" height="76" rx="14" class="base"/>
    <text x="145" y="241" text-anchor="middle" class="nodeTitle">01 坐标与姿态</text><text x="145" y="266" text-anchor="middle" class="nodeBody">怎样描述</text>
    <text x="345" y="241" text-anchor="middle" class="nodeTitle">02 运动学</text><text x="345" y="266" text-anchor="middle" class="nodeBody">关节 → 手脚</text>
    <text x="545" y="241" text-anchor="middle" class="nodeTitle">03 动力学</text><text x="545" y="266" text-anchor="middle" class="nodeBody">力 → 运动</text>
    <text x="745" y="241" text-anchor="middle" class="nodeTitle">04 反馈控制</text><text x="745" y="266" text-anchor="middle" class="nodeBody">测结果再纠偏</text>
    <text x="945" y="241" text-anchor="middle" class="nodeTitle">05 状态估计</text><text x="945" y="266" text-anchor="middle" class="nodeBody">测量 → 状态判断</text>
    <text x="1145" y="241" text-anchor="middle" class="nodeTitle">06 最优化</text><text x="1145" y="266" text-anchor="middle" class="nodeBody">目标 + 约束 → 动作</text>
    <text x="1345" y="241" text-anchor="middle" class="nodeTitle">07 系统架构</text><text x="1345" y="266" text-anchor="middle" class="nodeBody">连接所有模块</text>
    <path d="M235 248H250M435 248H450M635 248H650M835 248H850M1035 248H1050M1235 248H1250" class="arrow"/>
  </g>
  <path d="M750 144V195H145V205" class="arrow"/>

  <text x="385" y="355" text-anchor="middle" class="part">第二部分 · 传统模型控制</text>
  <text x="1115" y="355" text-anchor="middle" class="part">第三部分 · 学习控制</text>
  <g>
    <rect x="55" y="385" width="190" height="76" rx="14" class="classic"/>
    <rect x="270" y="385" width="190" height="76" rx="14" class="classic"/>
    <rect x="485" y="385" width="190" height="76" rx="14" class="classic"/>
    <rect x="165" y="495" width="190" height="76" rx="14" class="classic"/>
    <rect x="380" y="495" width="190" height="76" rx="14" class="classic"/>
    <text x="150" y="417" text-anchor="middle" class="nodeTitle">08 LIP / ZMP</text><text x="150" y="442" text-anchor="middle" class="nodeBody">行走平衡</text>
    <text x="365" y="417" text-anchor="middle" class="nodeTitle">09 SLIP / VMC</text><text x="365" y="442" text-anchor="middle" class="nodeBody">弹簧腿与落脚</text>
    <text x="580" y="417" text-anchor="middle" class="nodeTitle">10 WBC / TSID</text><text x="580" y="442" text-anchor="middle" class="nodeBody">全身任务落实</text>
    <text x="260" y="527" text-anchor="middle" class="nodeTitle">11 SRBD / MPC</text><text x="260" y="552" text-anchor="middle" class="nodeBody">简化模型看未来</text>
    <text x="475" y="527" text-anchor="middle" class="nodeTitle">12 CD / NMPC</text><text x="475" y="552" text-anchor="middle" class="nodeBody">全身动量看未来</text>
    <path d="M150 461V480H580V466M365 461V480" class="branch"/>
    <path d="M580 461V480H260V490M580 480H475V490" class="branch"/>
  </g>
  <g>
