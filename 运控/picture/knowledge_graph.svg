<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
  <defs>
    <style>
      .title{font:700 32px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .part{font:700 21px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .nodeTitle{font:700 17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .nodeBody{font:400 14px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}
      .note{font:400 15px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .entry{fill:#fff7ed;stroke:#fb923c;stroke-width:3}
      .base{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}
      .classic{fill:#f0fdf4;stroke:#4ade80;stroke-width:2.5}
      .learn{fill:#f5f3ff;stroke:#a78bfa;stroke-width:2.5}
      .integrate{fill:#fff7ed;stroke:#fb923c;stroke-width:2.5}
      .appendix{fill:#f8fafc;stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:8 6}
      .arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}
      .branch{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#b)}
      .lookup{stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#c)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1500" height="1040" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="title">机器人运动控制教程知识图谱</text>

  <rect x="590" y="72" width="320" height="72" rx="16" class="entry"/>
  <text x="750" y="102" text-anchor="middle" class="nodeTitle">00 先看全局</text>
  <text x="750" y="127" text-anchor="middle" class="nodeBody">目标、状态、模型、估计、真实闭环</text>

  <text x="750" y="183" text-anchor="middle" class="part">第一部分 · 物理与闭环基础</text>
  <g>
