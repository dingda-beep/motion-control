<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .head{font:700 22px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:400 16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .kin{fill:#eff6ff;stroke:#60a5fa;stroke-width:3}
      .dyn{fill:#fff7ed;stroke:#fb923c;stroke-width:3}
      .ok{fill:#f0fdf4;stroke:#4ade80;stroke-width:3}
      .arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}
      .warn{stroke:#ea580c;stroke-width:4;fill:none;marker-end:url(#b)}
      .link{stroke:#475569;stroke-width:7;stroke-linecap:round}
      .joint{fill:#2563eb}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ea580c"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">“脚能放到那里”不等于“机器人能这样走过去”</text>

  <rect x="45" y="100" width="300" height="415" rx="18" class="kin"/>
  <text x="195" y="140" text-anchor="middle" class="head">运动学：检查几何关系</text>
  <line x1="145" y1="375" x2="235" y2="260" class="link"/>
  <line x1="235" y1="260" x2="285" y2="365" class="link"/>
  <circle cx="145" cy="375" r="10" class="joint"/>
  <circle cx="235" cy="260" r="10" class="joint"/>
  <circle cx="285" cy="365" r="12" fill="#ef4444"/>
  <circle cx="285" cy="365" r="30" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="195" y="190" text-anchor="middle" class="body">输入：目标脚位姿</text>
  <text x="195" y="220" text-anchor="middle" class="body">输出：候选关节角 q_des</text>
  <text x="195" y="430" text-anchor="middle" class="small">检查：工作空间、关节限位、碰撞</text>
  <text x="195" y="460" text-anchor="middle" class="small">不检查：力矩、摩擦、落地冲击</text>

  <path d="M345 305H430" class="arrow"/>
  <rect x="435" y="100" width="330" height="415" rx="18" class="dyn"/>
  <text x="600" y="140" text-anchor="middle" class="head">动力学与接触：检查能否执行</text>
  <text x="470" y="190" class="body">□ 电机力矩和速度够吗？</text>
  <text x="470" y="235" class="body">□ 地面摩擦能提供所需外力吗？</text>
  <text x="470" y="280" class="body">□ 质心和角动量能被接住吗？</text>
  <text x="470" y="325" class="body">□ 接触时序和冲击允许吗？</text>
  <rect x="485" y="375" width="230" height="80" rx="14" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
  <text x="600" y="410" text-anchor="middle" class="head">可能否决或修改</text>
  <text x="600" y="440" text-anchor="middle" class="small">减速、改落脚点、换姿态</text>

  <path d="M765 305H850" class="warn"/>
  <rect x="855" y="100" width="300" height="415" rx="18" class="ok"/>
  <text x="1005" y="140" text-anchor="middle" class="head">闭环执行：现实最终裁决</text>
  <text x="1005" y="195" text-anchor="middle" class="body">控制器下发关节命令 u</text>
  <text x="1005" y="235" text-anchor="middle" class="body">真实接触与电机产生运动</text>
  <path d="M930 360Q1005 295 1080 360" fill="none" stroke="#16a34a" stroke-width="5"/>
  <circle cx="930" cy="360" r="10" fill="#2563eb"/>
  <circle cx="1005" cy="295" r="12" fill="#ef4444"/>
  <circle cx="1080" cy="360" r="10" fill="#2563eb"/>
  <text x="1005" y="410" text-anchor="middle" class="small">传感器比较期望与实际</text>
  <text x="1005" y="440" text-anchor="middle" class="small">下一周期继续修正</text>

  <rect x="180" y="550" width="840" height="48" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="600" y="581" text-anchor="middle" class="body">IK 给出几何候选；动力学、接触、执行器和反馈共同决定它能否成为真实动作</text>
</svg>
