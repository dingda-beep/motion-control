<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .head{font:700 21px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:400 15px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .skill{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .teacher{fill:#eff6ff;stroke:#60a5fa;stroke-width:3}
      .student{fill:#f5f3ff;stroke:#a78bfa;stroke-width:3}
      .real{fill:#fff7ed;stroke:#fb923c;stroke-width:3}
      .arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}
      .conflict{stroke:#ef4444;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#r)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ef4444"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">多动作策略：扩大覆盖范围，也扩大冲突、数据和验证难度</text>

  <rect x="45" y="100" width="180" height="78" rx="14" class="skill"/>
  <rect x="45" y="205" width="180" height="78" rx="14" class="skill"/>
  <rect x="45" y="310" width="180" height="78" rx="14" class="skill"/>
  <rect x="45" y="415" width="180" height="78" rx="14" class="skill"/>
  <text x="135" y="148" text-anchor="middle" class="body">行走数据/任务</text>
  <text x="135" y="253" text-anchor="middle" class="body">跑步数据/任务</text>
  <text x="135" y="358" text-anchor="middle" class="body">踢腿数据/任务</text>
  <text x="135" y="463" text-anchor="middle" class="body">单腿站立任务</text>

  <rect x="330" y="100" width="235" height="393" rx="18" class="teacher"/>
  <text x="447" y="140" text-anchor="middle" class="head">多个专家 Teacher</text>
  <text x="447" y="182" text-anchor="middle" class="small">先在独立参数空间学习</text>
  <rect x="375" y="220" width="145" height="55" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="375" y="300" width="145" height="55" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="375" y="380" width="145" height="55" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="447" y="254" text-anchor="middle" class="small">低动态专家</text>
  <text x="447" y="334" text-anchor="middle" class="small">高动态专家</text>
  <text x="447" y="414" text-anchor="middle" class="small">平衡专家</text>
  <path d="M225 139H325M225 244H325M225 349H325M225 454H325" class="arrow"/>

  <path d="M565 295H630" class="arrow"/>
  <rect x="635" y="100" width="250" height="393" rx="18" class="student"/>
  <text x="760" y="140" text-anchor="middle" class="head">统一 Student / BFM</text>
  <text x="760" y="182" text-anchor="middle" class="small">技能条件 + 当前观测 → 动作</text>
  <rect x="685" y="230" width="150" height="105" rx="14" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="760" y="270" text-anchor="middle" class="body">蒸馏多个专家</text>
  <text x="760" y="302" text-anchor="middle" class="small">再用 RL 微调恢复</text>
  <path d="M700 390C760 340 820 440 845 375" class="conflict"/>
  <text x="760" y="450" text-anchor="middle" class="small">梯度冲突、技能遗忘、多峰动作</text>

  <path d="M885 295H945" class="arrow"/>
  <rect x="950" y="100" width="205" height="393" rx="18" class="real"/>
  <text x="1052" y="140" text-anchor="middle" class="head">闭环执行与评估</text>
  <text x="1052" y="200" text-anchor="middle" class="body">动作覆盖率</text>
  <text x="1052" y="240" text-anchor="middle" class="body">跟踪误差分布</text>
  <text x="1052" y="280" text-anchor="middle" class="body">扰动恢复</text>
  <text x="1052" y="320" text-anchor="middle" class="body">技能切换</text>
  <text x="1052" y="360" text-anchor="middle" class="body">真机成功率</text>
  <text x="1052" y="425" text-anchor="middle" class="small">不能只展示精选视频</text>
  <text x="1052" y="455" text-anchor="middle" class="small">规模不突破物理极限</text>

  <rect x="165" y="545" width="870" height="48" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="600" y="576" text-anchor="middle" class="body">行为基础模型仍是闭环中的决策模块；更多动作数据不等于拥有无限的稳定可达域</text>
</svg>
