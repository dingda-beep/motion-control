<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
  <defs>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .head{font:700 23px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:400 16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .link{stroke:#475569;stroke-width:8;stroke-linecap:round}
      .joint{fill:#2563eb;stroke:#1e3a8a;stroke-width:2}
      .internal{stroke:#7c3aed;stroke-width:4;fill:none;marker-end:url(#p)}
      .force{stroke:#16a34a;stroke-width:6;fill:none;marker-end:url(#g)}
      .gravity{stroke:#ef4444;stroke-width:5;fill:none;marker-end:url(#r)}
    </style>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7c3aed"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#16a34a"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ef4444"/></marker>
  </defs>
  <rect width="1200" height="610" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">接触不仅限制脚，也给浮动身体提供外部控制力</text>

  <rect x="55" y="95" width="500" height="430" rx="18" class="panel"/>
  <text x="305" y="138" text-anchor="middle" class="head">腾空：电机只能产生内部作用</text>
  <circle cx="305" cy="225" r="20" class="joint"/>
  <line x1="305" y1="245" x2="305" y2="335" class="link"/>
  <line x1="305" y1="270" x2="225" y2="320" class="link"/>
  <line x1="305" y1="270" x2="385" y2="320" class="link"/>
  <line x1="305" y1="335" x2="240" y2="410" class="link"/>
  <line x1="305" y1="335" x2="370" y2="410" class="link"/>
  <path d="M245 295Q305 255 365 295" class="internal"/>
  <path d="M305 285V375" class="gravity"/>
  <text x="395" y="360" class="body">重力</text>
  <text x="305" y="455" text-anchor="middle" class="body">关节可改变身体姿态与内部动量分配</text>
  <text x="305" y="487" text-anchor="middle" class="small">但不能凭空给整机一个水平推进力</text>

  <rect x="645" y="95" width="500" height="430" rx="18" class="panel"/>
  <text x="895" y="138" text-anchor="middle" class="head">支撑：地面反力成为控制通道</text>
  <line x1="705" y1="450" x2="1085" y2="450" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <circle cx="895" cy="215" r="20" class="joint"/>
  <line x1="895" y1="235" x2="895" y2="325" class="link"/>
  <line x1="895" y1="260" x2="820" y2="305" class="link"/>
  <line x1="895" y1="260" x2="970" y2="305" class="link"/>
  <line x1="895" y1="325" x2="825" y2="450" class="link"/>
  <line x1="895" y1="325" x2="965" y2="450" class="link"/>
  <path d="M825 435V345" class="force"/>
  <path d="M965 435L1010 355" class="force"/>
  <path d="M895 275V365" class="gravity"/>
  <text x="1020" y="345" class="body">地面反力 λ</text>
  <text x="895" y="487" text-anchor="middle" class="small">法向力、摩擦力和力矩共同改变整机动量</text>

  <rect x="175" y="550" width="850" height="42" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="600" y="578" text-anchor="middle" class="body">落地、离地或打滑会改变“当前还能用哪些控制手段”，所以接触模式必须被正确估计</text>
</svg>
