<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .head{font:700 21px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:400 15px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .sensor{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .estimate{fill:#f0fdf4;stroke:#4ade80;stroke-width:3}
      .predict{fill:#eff6ff;stroke:#60a5fa;stroke-width:3}
      .arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}
      .update{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#g)}
      .warn{stroke:#ef4444;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#r)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#16a34a"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ef4444"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">状态估计：模型给先验，传感器给证据，两者共同形成 x_hat</text>

  <rect x="45" y="100" width="225" height="95" rx="14" class="sensor"/>
  <text x="157" y="137" text-anchor="middle" class="head">IMU</text>
  <text x="157" y="169" text-anchor="middle" class="small">角速度、比力；短时快但会漂移</text>
  <rect x="45" y="240" width="225" height="95" rx="14" class="sensor"/>
  <text x="157" y="277" text-anchor="middle" class="head">关节编码器</text>
  <text x="157" y="309" text-anchor="middle" class="small">关节位置和速度</text>
  <rect x="45" y="380" width="225" height="95" rx="14" class="sensor"/>
  <text x="157" y="417" text-anchor="middle" class="head">足底力 / 接触</text>
  <text x="157" y="449" text-anchor="middle" class="small">支撑脚约束；打滑时会失效</text>

  <rect x="365" y="105" width="300" height="145" rx="18" class="predict"/>
  <text x="515" y="145" text-anchor="middle" class="head">预测：f_model</text>
  <text x="515" y="185" text-anchor="middle" class="body">上一估计 + 控制输入</text>
  <text x="515" y="217" text-anchor="middle" class="small">得到先验 x_hat⁻ 与不确定性 P⁻</text>
  <rect x="365" y="330" width="300" height="145" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="515" y="370" text-anchor="middle" class="head">观测更新</text>
  <text x="515" y="410" text-anchor="middle" class="body">比较预测测量与真实测量</text>
  <text x="515" y="442" text-anchor="middle" class="small">按模型/传感器可信度分配权重</text>

  <path d="M270 147H360M270 287C320 287 320 390 360 390M270 427H360" class="update"/>
  <path d="M515 250V325" class="arrow"/>
  <rect x="770" y="190" width="370" height="210" rx="18" class="estimate"/>
  <text x="955" y="235" text-anchor="middle" class="head">后验状态估计 x_hat</text>
  <text x="810" y="280" class="body">• 基座位置、姿态、速度</text>
  <text x="810" y="318" class="body">• 关节状态与接触概率</text>
  <text x="810" y="356" class="body">• 协方差 P：我们有多不确定</text>
  <path d="M665 402H765" class="update"/>
  <path d="M955 405V500H515V480" class="arrow"/>
  <text x="735" y="530" text-anchor="middle" class="small">下一周期继续预测</text>

  <path d="M955 185V105H1115" class="warn"/>
  <text x="920" y="82" class="body">控制器使用 x_hat，不是 x_real</text>
  <rect x="150" y="570" width="900" height="45" rx="13" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
  <text x="600" y="599" text-anchor="middle" class="body">若不同真实状态产生相同测量历史，仅靠调滤波参数无法区分：这就是不可观测边界</text>
</svg>
