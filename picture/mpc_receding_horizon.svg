<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .head{font:700 21px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:400 16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .axis{stroke:#64748b;stroke-width:3}
      .pred{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}
      .exec{fill:#fb923c;stroke:#c2410c;stroke-width:3}
      .future{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}
      .arrow{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#g)}
    </style>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">MPC 的滚动时域：每次规划很多步，但只执行第一步</text>

  <text x="70" y="115" class="head">周期 k</text>
  <line x1="180" y1="120" x2="1120" y2="120" class="axis"/>
  <rect x="190" y="88" width="110" height="64" rx="12" class="exec"/>
  <text x="245" y="127" text-anchor="middle" class="body">执行 u[k]</text>
  <rect x="320" y="88" width="110" height="64" rx="12" class="pred"/>
  <rect x="450" y="88" width="110" height="64" rx="12" class="pred"/>
  <rect x="580" y="88" width="110" height="64" rx="12" class="pred"/>
  <rect x="710" y="88" width="110" height="64" rx="12" class="pred"/>
  <rect x="840" y="88" width="110" height="64" rx="12" class="pred"/>
  <text x="635" y="127" text-anchor="middle" class="body">模型预测的未来输入序列</text>
  <text x="1035" y="127" text-anchor="middle" class="small">越远越不确定</text>

  <path d="M245 165C245 225 365 225 365 272" class="arrow"/>
  <text x="455" y="222" class="body">真实机器人执行后，传感器得到新证据</text>

  <text x="70" y="320" class="head">周期 k+1</text>
  <line x1="180" y1="325" x2="1120" y2="325" class="axis"/>
  <rect x="190" y="293" width="110" height="64" rx="12" class="future"/>
  <text x="245" y="332" text-anchor="middle" class="small">已经过去</text>
  <rect x="320" y="293" width="110" height="64" rx="12" class="exec"/>
  <text x="375" y="332" text-anchor="middle" class="body">新 u[k+1]</text>
  <rect x="450" y="293" width="110" height="64" rx="12" class="pred"/>
  <rect x="580" y="293" width="110" height="64" rx="12" class="pred"/>
  <rect x="710" y="293" width="110" height="64" rx="12" class="pred"/>
  <rect x="840" y="293" width="110" height="64" rx="12" class="pred"/>
  <rect x="970" y="293" width="110" height="64" rx="12" class="pred"/>
  <text x="700" y="390" text-anchor="middle" class="body">用新的状态估计 x_hat 重新预测，而不是照搬上一周期剩余计划</text>

  <rect x="160" y="445" width="880" height="78" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="600" y="478" text-anchor="middle" class="head">预测负责提前看，反馈负责不断校正</text>
  <text x="600" y="508" text-anchor="middle" class="small">求解成功只保证 f_model 中的计划可行；下一次测量负责暴露它与 f_real 的偏差</text>
</svg>
