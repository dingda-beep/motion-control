<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
  <defs>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .head{font:700 20px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:400 14px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .deploy-box{fill:#fff7ed;stroke:#fb923c;stroke-width:3}
      .train-box{fill:#eff6ff;stroke:#60a5fa;stroke-width:3}
      .plain{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .deploy-arrow{stroke:#ea580c;stroke-width:4;fill:none;marker-end:url(#orange-arrow)}
      .feedback-arrow{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#green-arrow)}
      .train-arrow{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#blue-arrow)}
      .update-arrow{stroke:#7c3aed;stroke-width:3.5;stroke-dasharray:9 7;fill:none;marker-end:url(#purple-arrow)}
    </style>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ea580c"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#16a34a"/></marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1300" height="760" fill="#f8fafc"/>
  <text x="650" y="45" text-anchor="middle" class="title">同一个 Actor，嵌在两条不同的闭环里</text>

  <rect x="35" y="78" width="1230" height="330" rx="20" class="deploy-box"/>
  <text x="62" y="115" class="head">部署闭环：每 20 ms 真的影响机器人</text>

  <rect x="68" y="150" width="170" height="90" rx="14" class="plain"/>
  <text x="153" y="183" text-anchor="middle" class="head">上层命令</text>
  <text x="153" y="211" text-anchor="middle" class="body">vx / vy / vyaw</text>

  <rect x="280" y="150" width="190" height="90" rx="14" class="plain"/>
  <text x="375" y="183" text-anchor="middle" class="head">观测构造</text>
  <text x="375" y="211" text-anchor="middle" class="body">q、dq、IMU、历史</text>

  <rect x="515" y="150" width="160" height="90" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
  <text x="595" y="183" text-anchor="middle" class="head">Actor</text>
  <text x="595" y="211" text-anchor="middle" class="body">480 → 29</text>

  <rect x="720" y="150" width="190" height="90" rx="14" class="plain"/>
  <text x="815" y="183" text-anchor="middle" class="head">动作处理</text>
  <text x="815" y="211" text-anchor="middle" class="body">scale + default + map</text>

  <rect x="955" y="150" width="240" height="90" rx="14" class="plain"/>
  <text x="1075" y="183" text-anchor="middle" class="head">PD 与电机</text>
  <text x="1075" y="211" text-anchor="middle" class="body">q_des → τ_cmd</text>

  <path d="M238 195H275M470 195H510M675 195H715M910 195H950" class="deploy-arrow"/>

  <rect x="955" y="285" width="240" height="82" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/>
  <text x="1075" y="317" text-anchor="middle" class="head">真实机器人与接触</text>
  <text x="1075" y="344" text-anchor="middle" class="body">产生下一时刻身体状态</text>
  <path d="M1075 240V280" class="deploy-arrow"/>
  <path d="M955 326H375V245" class="feedback-arrow"/>
  <text x="672" y="350" text-anchor="middle" class="small">SDK 反馈 q、dq、IMU；现实不是奖励函数，也不是仿真真值</text>

  <rect x="35" y="438" width="1230" height="276" rx="20" class="train-box"/>
  <text x="62" y="477" class="head">训练闭环：仿真批量制造经验，再更新 Actor 参数</text>

  <rect x="80" y="525" width="210" height="92" rx="14" class="plain"/>
  <text x="185" y="558" text-anchor="middle" class="head">4096 个仿真环境</text>
  <text x="185" y="586" text-anchor="middle" class="body">状态、动作、下一状态</text>

  <rect x="350" y="525" width="190" height="92" rx="14" class="plain"/>
  <text x="445" y="558" text-anchor="middle" class="head">奖励与终止</text>
  <text x="445" y="586" text-anchor="middle" class="body">这一步多好、是否结束</text>

  <rect x="600" y="525" width="190" height="92" rx="14" class="plain"/>
  <text x="695" y="558" text-anchor="middle" class="head">Rollout</text>
  <text x="695" y="586" text-anchor="middle" class="body">98,304 条转移/迭代</text>

  <rect x="850" y="525" width="170" height="92" rx="14" class="plain"/>
  <text x="935" y="558" text-anchor="middle" class="head">PPO 更新</text>
  <text x="935" y="586" text-anchor="middle" class="body">优势、裁剪、梯度</text>

  <rect x="1080" y="525" width="145" height="92" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
  <text x="1152" y="558" text-anchor="middle" class="head">新参数</text>
  <text x="1152" y="586" text-anchor="middle" class="body">Actor / Critic</text>

  <path d="M290 571H345M540 571H595M790 571H845M1020 571H1075" class="train-arrow"/>
  <path d="M1152 523C1152 470 595 470 595 245" class="update-arrow"/>
  <text x="842" y="495" text-anchor="middle" class="small">只有参数更新穿回 Actor；奖励和 Critic 不进入真机电机循环</text>
  <text x="650" y="744" text-anchor="middle" class="body">可部署的核心：训练和部署必须对 Actor 两端的输入输出保持同一种解释</text>
</svg>
