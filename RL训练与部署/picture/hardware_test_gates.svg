<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650">
  <defs>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .head{font:700 19px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 15px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:400 13px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .level0{fill:#eff6ff;stroke:#60a5fa;stroke-width:3}.level1{fill:#ecfeff;stroke:#22d3ee;stroke-width:3}
      .level2{fill:#f0fdf4;stroke:#4ade80;stroke-width:3}.level3{fill:#fefce8;stroke:#facc15;stroke-width:3}
      .level4{fill:#fff7ed;stroke:#fb923c;stroke-width:3}.level5{fill:#fef2f2;stroke:#f87171;stroke-width:3}
      .pass{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#green)}
      .fail{stroke:#dc2626;stroke-width:3.5;stroke-dasharray:8 6;fill:none;marker-end:url(#red)}
    </style>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#16a34a"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1320" height="650" fill="#f8fafc"/>
  <text x="660" y="45" text-anchor="middle" class="title">真机不是“一键部署”：每一级只增加一种真实风险</text>

  <rect x="45" y="415" width="180" height="145" rx="16" class="level0"/>
  <text x="135" y="450" text-anchor="middle" class="head">Level 0</text>
  <text x="135" y="478" text-anchor="middle" class="body">完全离线</text>
  <text x="135" y="506" text-anchor="middle" class="small">契约、黄金向量</text>
  <text x="135" y="529" text-anchor="middle" class="small">超时/NaN 故障注入</text>

  <rect x="255" y="355" width="180" height="145" rx="16" class="level1"/>
  <text x="345" y="390" text-anchor="middle" class="head">Level 1</text>
  <text x="345" y="418" text-anchor="middle" class="body">只读真实状态</text>
  <text x="345" y="446" text-anchor="middle" class="small">q/dq/IMU/时间戳</text>
  <text x="345" y="469" text-anchor="middle" class="small">禁止电机执行</text>

  <rect x="465" y="295" width="180" height="145" rx="16" class="level2"/>
  <text x="555" y="330" text-anchor="middle" class="head">Level 2</text>
  <text x="555" y="358" text-anchor="middle" class="body">支撑下非 RL</text>
  <text x="555" y="386" text-anchor="middle" class="small">单关节、默认姿态</text>
  <text x="555" y="409" text-anchor="middle" class="small">PD 与急停</text>

  <rect x="675" y="235" width="180" height="145" rx="16" class="level3"/>
  <text x="765" y="270" text-anchor="middle" class="head">Level 3</text>
  <text x="765" y="298" text-anchor="middle" class="body">支撑下策略接管</text>
  <text x="765" y="326" text-anchor="middle" class="small">零命令、历史初始化</text>
  <text x="765" y="349" text-anchor="middle" class="small">接管与退出</text>

  <rect x="885" y="175" width="180" height="145" rx="16" class="level4"/>
  <text x="975" y="210" text-anchor="middle" class="head">Level 4</text>
  <text x="975" y="238" text-anchor="middle" class="body">受控落地</text>
  <text x="975" y="266" text-anchor="middle" class="small">站立 → 小命令</text>
  <text x="975" y="289" text-anchor="middle" class="small">支撑、净空、急停</text>

  <rect x="1095" y="115" width="180" height="145" rx="16" class="level5"/>
  <text x="1185" y="150" text-anchor="middle" class="head">Level 5</text>
  <text x="1185" y="178" text-anchor="middle" class="body">扩大能力包络</text>
  <text x="1185" y="206" text-anchor="middle" class="small">速度、地面、载荷</text>
  <text x="1185" y="229" text-anchor="middle" class="small">每扩一项重新验收</text>

  <path d="M225 440L250 415M435 380L460 355M645 320L670 295M855 260L880 235M1065 200L1090 175" class="pass"/>
  <text x="650" y="600" text-anchor="middle" class="head">每一级输出：证据 + GO / NO-GO</text>
  <text x="650" y="627" text-anchor="middle" class="body">GO 才把同一冻结版本交给下一级；NO-GO 保存日志，退回能复现问题的最低层</text>

  <path d="M1185 265V575H765V385" class="fail"/>
  <text x="1010" y="558" text-anchor="middle" class="small">异常不是“再试一次”，而是回到接口与证据</text>
</svg>
