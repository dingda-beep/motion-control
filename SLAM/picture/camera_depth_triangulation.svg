<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#385572"/>
    </marker>
    <style>
      .title{font:700 32px sans-serif;fill:#17233b}
      .sub{font:700 23px sans-serif;fill:#243a57}
      .body{font:18px sans-serif;fill:#3c506a}
      .small{font:16px sans-serif;fill:#60738a}
      .ray{stroke:#d46750;stroke-width:4;fill:none}
      .axis{stroke:#385572;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .guide{stroke:#8fa0b4;stroke-width:2;stroke-dasharray:8 8;fill:none}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="640" y="52" text-anchor="middle" class="title">单个像素缺少深度；第二个观察位置提供三角约束</text>
  <line x1="640" y1="85" x2="640" y2="655" stroke="#d8dee8" stroke-width="2"/>

  <text x="320" y="105" text-anchor="middle" class="sub">一台单目相机：同一射线有无数候选点</text>
  <circle cx="120" cy="520" r="12" fill="#385572"/>
  <text x="120" y="555" text-anchor="middle" class="body">相机中心 C</text>
  <path d="M120 520 L570 190" class="ray"/>
  <line x1="235" y1="175" x2="235" y2="570" stroke="#5e85a9" stroke-width="5"/>
  <text x="235" y="603" text-anchor="middle" class="body">成像平面</text>
  <circle cx="235" cy="436" r="10" fill="#f2ad3d" stroke="#9d6a14" stroke-width="2"/>
  <text x="257" y="424" class="body">同一个像素</text>
  <circle cx="390" cy="322" r="12" fill="#64a96b"/>
  <text x="405" y="306" class="body">P₁（较近）</text>
  <circle cx="520" cy="226" r="12" fill="#806ac1"/>
  <text x="535" y="210" class="body">P₂（较远）</text>
  <path d="M120 520 H555" class="axis"/>
  <text x="556" y="547" text-anchor="end" class="small">光轴 Z</text>
  <text x="320" y="646" text-anchor="middle" class="body">投影只保留 X/Z、Y/Z：距离整体放大，像素可以不变</text>

  <text x="960" y="105" text-anchor="middle" class="sub">两个相机中心：正确对应产生两条不同射线</text>
  <circle cx="750" cy="545" r="12" fill="#385572"/>
  <text x="750" y="580" text-anchor="middle" class="body">C₁</text>
  <circle cx="1115" cy="545" r="12" fill="#385572"/>
  <text x="1115" y="580" text-anchor="middle" class="body">C₂</text>
  <circle cx="940" cy="215" r="15" fill="#64a96b" stroke="#3e7945" stroke-width="2"/>
  <text x="940" y="185" text-anchor="middle" class="body">同一空间点 P</text>
  <path d="M750 545 L940 215" class="ray"/>
  <path d="M1115 545 L940 215" class="ray"/>
  <path d="M750 545 H1115" class="guide"/>
  <text x="932" y="525" text-anchor="middle" class="body">基线 B</text>
  <path d="M810 515 A70 70 0 0 1 787 476" fill="none" stroke="#f2ad3d" stroke-width="4"/>
  <text x="825" y="472" class="small">视差角</text>
  <text x="960" y="625" text-anchor="middle" class="body">夹角越大，交点对像素小误差越稳定；两射线近乎平行时深度很脆弱</text>
</svg>
